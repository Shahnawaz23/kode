spring.application.name=invoice-service
server.port=8088

spring.datasource.url=jdbc:mysql://localhost:3306/order-processing
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.auto-commit=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

#Redis properties
spring.data.redis.host=welcomed-condor-230133.upstash.io
#spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=#
spring.data.redis.ssl.enabled=true
spring.cache.type=redis
spring.jpa.open-in-view=false

#actuator properties


management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/span
spring.cloud.openfeign.micrometer.enabled=true
logging.pattern.level=%5p [${spring.applicantion.name:},traceId=%X{traceId:-},spanId=%X{spanId:-}]

# Which endpoints are exposed over HTTP
#management.endpoints.web.exposure.include=health,info,metrics,caches,env,beans,mappings,loggers
management.endpoints.web.exposure.exclude=shutdown

# Expose everything (use carefully, usually only in dev)
management.endpoints.web.exposure.include=*

# JMX exposure (separate from web)
management.endpoints.jmx.exposure.include=health,info
management.endpoint.health.show-details=always

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
